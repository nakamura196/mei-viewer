<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>移転しました｜音高エディタ</title>
<!-- 音高エディタは、誰でも自分の MEI を開ける単独ツール (https://mei.ldas.jp/) になった。
     github.io はサーバ側で転送できないので、?id= を見て同じ曲を開いた状態へ JS で移る。
     data/ と dts/ はここで配信を続ける (エディタもここの MEI を読む)。 -->
<script>
(function () {
  var TOOL = "https://mei.ldas.jp/";
  var DATA = "https://nakamura196.github.io/mei-viewer/data/";
  var KNOWN = ["choucho", "heidenroslein"];
  var id = new URLSearchParams(location.search).get("id") || "choucho";
  var to = KNOWN.indexOf(id) >= 0 ? TOOL + "?url=" + encodeURIComponent(DATA + id + "/" + id + ".mei") : TOOL;
  var link = document.createElement("link");
  link.rel = "canonical";
  link.href = to;
  document.head.appendChild(link);
  window.__MEI_FORWARD__ = to;
  setTimeout(function () { location.replace(to); }, 1500);
})();
</script>
<style>
  body { font-family: "Noto Sans JP", system-ui, sans-serif; margin: 0; padding: 3rem 1rem; line-height: 1.8; color: #222; background: #fff; }
  main { max-width: 36rem; margin: 0 auto; }
  a { color: #1a56db; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>音高エディタは移転しました</h1>
  <p>音高エディタは、自分の MEI ファイルも開ける単独のツールになりました。自動で移動します。</p>
  <p>移動しない場合は、こちらを開いてください。<br><a id="to" href="https://mei.ldas.jp/">https://mei.ldas.jp/</a></p>
  <p lang="en">The pitch editor has moved to a standalone tool that can open any MEI file. You will be redirected shortly.</p>
</main>
<script>
  var a = document.getElementById("to");
  a.href = a.textContent = window.__MEI_FORWARD__;
</script>
</body>
</html>
