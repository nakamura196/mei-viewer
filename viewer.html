<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>移転しました｜音楽符号化デモ</title>
<!-- ビューアは archivebase へ移った。github.io はサーバ側で転送できないので、
     ?id= を見て移転先を決め、JS で移る。data/ と dts/ はここで配信を続ける。 -->
<script>
(function () {
  var BASE = "https://ab.ldas.jp/na-kamura-1263/mei-scores";
  var KNOWN = ["choucho", "heidenroslein"];
  var id = new URLSearchParams(location.search).get("id") || "choucho";
  var to = KNOWN.indexOf(id) >= 0 ? BASE + "/resource/" + id : BASE;
  var link = document.createElement("link");
  link.rel = "canonical";
  link.href = to;
  document.head.appendChild(link);
  window.__MEI_FORWARD__ = to;
  setTimeout(function () { location.replace(to); }, 1500);
})();
</script>
<style>
  body { font-family: "Noto Sans JP", system-ui, sans-serif; margin: 0; padding: 3rem 1rem; line-height: 1.8; color: #222; background: #fff; }
  main { max-width: 36rem; margin: 0 auto; }
  a { color: #1a56db; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>ビューアは移転しました</h1>
  <p>このビューアは archivebase へ移りました。自動で移動します。</p>
  <p>移動しない場合は、こちらを開いてください。<br><a id="to" href="https://ab.ldas.jp/na-kamura-1263/mei-scores">https://ab.ldas.jp/na-kamura-1263/mei-scores</a></p>
  <p lang="en">This viewer has moved to archivebase. You will be redirected shortly.</p>
</main>
<script>
  var a = document.getElementById("to");
  a.href = a.textContent = window.__MEI_FORWARD__;
</script>
</body>
</html>
